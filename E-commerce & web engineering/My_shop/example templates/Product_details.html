
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card Template</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #152653;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .product-card {
      background: white;
      width: 340px;
      margin: 40px auto;
      padding: 25px 20px 20px 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .product-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #222;
    }
    .product-desc {
      font-size: 15px;
      color: #555;
      margin-bottom: 10px;
    }
    .product-price {
      color: #FF5733;
      font-weight: bold;
      font-size: 18px;
      margin: 10px 0;
    }
    .product-categories {
      margin-bottom: 12px;
    }
    .category-btn {
      padding: 6px 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      margin: 2px;
      cursor: default;
    }
    .product-actions button, .product-actions a {
      padding: 10px 15px;
      background: orange;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      font-size: 15px;
      text-decoration: none;
      display: inline-block;
    }
    .product-actions .btn-secondary {
      background: #667eea;
    }
    .product-actions .btn-warning {
      background: #FF5733;
    }
    .product-actions .btn-primary{
      background: #242424;
      text-decoration: none;
      color: white;
    }
    .product-actions .btn-secondary:hover, .product-actions .btn-warning:hover, .product-actions .btn-primary:hover {
      opacity: 0.85;
    }
    .product-card strong.text-danger {
      display: block;
      margin-top: 10px;
      color: #e63946;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="product-card">
    <img src="your-product-image.jpg" alt="Product Image">
    <div class="product-title">Product Title</div>
    <div class="product-desc">Product description goes here.</div>
    <div class="product-price">1000 taka</div>
    <div class="product-categories">
      <span class="category-btn">Category 1</span>
      <span class="category-btn">Category 2</span>
    </div>
    <div class="product-actions">
      <a class="btn-warning" href="#">Add to Cart</a>
      <a class="btn-secondary" href="#">Buy Now</a>
    </div>
    <div class="product-actions">
      <a class="btn-primary" href="#">Cancel</a>
    </div>
  </div>
</body>
</html>
