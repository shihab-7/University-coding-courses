<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login with Social & Error</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* total body styles are taken as inherited from base template */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .input-container {
      position: relative;
      margin-bottom: 20px;
    }

    .login-box label {
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      display: block;
    }

    .login-box input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s;
    }

    .login-box input:focus {
      border-color: #667eea;
      outline: none;
      box-shadow: 0 0 6px rgba(102, 126, 234, 0.5);
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #888;
    }

    .login-box button[type="submit"] {
      width: 100%;
      background-color: #667eea;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .login-box button:hover {
      background-color: #5a67d8;
    }

    .social-login {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-login button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .google {
      background-color: #db4437;
      color: white;
    }

    .facebook {
      background-color: #3b5998;
      color: white;
    }

    .login-box p {
      text-align: center;
      margin-top: 15px;
      color: #888;
    }

    .error-message {
      color: red;
      text-align: center;
      margin-bottom: 15px;
      display: none;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <div id="error" class="error-message">Invalid username or password</div>
    <form onsubmit="return validateLogin(event)">
      <label for="username">Username*</label>
      <div class="input-container">
        <input type="text" id="username" name="username" required />
      </div>

      <label for="password">Password*</label>
      <div class="input-container">
        <input type="password" id="password" name="password" required />
        <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
      </div>

      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="#" style="color:#667eea; text-decoration:none;">Sign up</a></p>
  </div>

  <script>
    function togglePassword() {
      const passwordField = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password');
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        passwordField.type = 'password';
        toggleBtn.textContent = '👁';
      }
    }

    //not used these test validation
    function validateLogin(event) {
      event.preventDefault(); // stop actual form submit
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Just a demo check (hardcoded)
      if (username === "admin" && password === "1234") {
        alert("Login successful!");
        document.getElementById("error").style.display = "none";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }
  </script>
</body>
</html>
