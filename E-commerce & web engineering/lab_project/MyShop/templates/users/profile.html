{% extends 'base.html' %}
{% block content %}
<h2>{{ user_profile.user.username }}'s Profile</h2>
<h3>Liked Products</h3>
<ul>
  {% for product in liked_products %}
    <li>
      {{ product.name }}
      <button class="like-btn" data-product-id="{{ product.id }}" data-liked="true">Unlike</button>
    </li>
  {% endfor %}
</ul>

<h3>All Products</h3>
<ul>
  {% for product in all_products %}
    <li>
      {{ product.name }}
      <button class="like-btn" data-product-id="{{ product.id }}" data-liked="{% if product in liked_products %}true{% else %}false{% endif %}">
        {% if product in liked_products %}Unlike{% else %}Like{% endif %}
      </button>
    </li>
  {% endfor %}
</ul>

<script src="{% static 'js/app.js' %}"></script>
{% endblock %}
